name: Test skip when cobc already installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Put a fake cobc on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/cobc" <<'EOF'
          #!/bin/sh
          echo "fake cobc $*"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/cobc"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          force: "false"
      - name: Assert installed output is false
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          echo "PASS"
      - name: Assert fake cobc still in use
        run: |
          OUT="$(cobc --info)"
          echo "output: $OUT"
          case "$OUT" in
            "fake cobc"*) echo "PASS" ;;
            *) echo "FAIL: expected fake cobc to remain"; exit 1 ;;
          esac
