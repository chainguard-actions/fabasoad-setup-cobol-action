---
name: Test skip installation when cobc already installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # First install
      - id: first-install
        uses: .
        with:
          force: "false"
      - name: Assert first install succeeded
        env:
          ACTUAL: ${{ steps.first-install.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed=true on first install but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: first install installed=true"
      # Second run with force=false should skip installation
      - id: second-run
        uses: .
        with:
          force: "false"
      - name: Assert second run skipped installation
        env:
          ACTUAL: ${{ steps.second-run.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed=false (skipped) on second run but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: second run correctly skipped installation (installed=false)"
      - name: Assert cobc is still available after skip
        run: |
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc not found on PATH after skip"
            exit 1
          fi
          echo "PASS: cobc still available at $(which cobc)"
