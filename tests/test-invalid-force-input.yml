---
name: Test invalid force input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          force: "invalid-value"
        continue-on-error: true

      - name: Assert action failed due to invalid force input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid force input, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid force input"
