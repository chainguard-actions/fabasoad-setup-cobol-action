---
name: Test invalid force input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "3.3"
          force: "invalid-value"
        continue-on-error: true
      - name: Assert action failed with invalid force input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid force input but it succeeded"
            exit 1
          fi
          echo "PASS: action did not succeed as expected (outcome='$OUTCOME')"
