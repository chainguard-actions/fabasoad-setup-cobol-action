---
name: Test basic usage - install GnuCOBOL with default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GnuCOBOL via apt-get first (to make test fast)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnucobol

      - id: action
        uses: .
        with:
          version: "3.2"
          force: "false"

      - name: Assert installed output is false (cobc was already installed, skip)
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' (installation skipped because cobc already present)"
            exit 1
          fi
          echo "PASS"

      - name: Assert cobc is available on PATH
        run: |
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc not found on PATH"
            exit 1
          fi
          echo "PASS: cobc found at $(which cobc)"
          cobc --version
