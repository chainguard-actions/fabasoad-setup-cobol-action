---
name: Test basic usage - install GnuCOBOL with default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: installed=true"
      - name: Assert cobc is available
        run: |
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc not found on PATH"
            exit 1
          fi
          echo "PASS: cobc is available at $(which cobc)"
      - name: Assert cobc version output
        run: |
          cobc --version
          echo "PASS: cobc --version succeeded"
