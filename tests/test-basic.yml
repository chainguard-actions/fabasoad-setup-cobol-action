name: Test basic usage - default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed='true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert cobc is available
        run: |
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc command not found"
            exit 1
          fi
          echo "cobc found at: $(command -v cobc)"
          cobc --version
          echo "PASS"
