---
name: Test force install - reinstall even if cobc is already present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install GnuCOBOL via apt-get
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnucobol
          echo "Pre-installed cobc: $(cobc --version | head -1)"

      - id: action
        uses: .
        with:
          version: "4.0"
          force: "true"

      - name: Assert installed output is true (forced reinstall)
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' (forced installation should have run)"
            exit 1
          fi
          echo "PASS"

      - name: Assert cobc is available on PATH after force install
        run: |
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc not found on PATH after force install"
            exit 1
          fi
          echo "PASS: cobc found at $(which cobc)"
          cobc --version
