name: Test force install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # First install using apt-get (version 4.0)
      - id: first-install
        uses: .
        with:
          version: "4.0"
          force: "false"
      - name: Assert first install succeeded
        env:
          ACTUAL: ${{ steps.first-install.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: first install succeeded"
      # Now force reinstall - cobc is already installed, force=true triggers reinstall
      - id: force-install
        uses: .
        with:
          version: "4.0"
          force: "true"
      - name: Assert force install output is true
        env:
          ACTUAL: ${{ steps.force-install.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: force install succeeded"
      - name: Assert cobc is still available after force reinstall
        run: |
          which cobc || { echo "FAIL: cobc not found in PATH after force reinstall"; exit 1; }
          cobc --version
          echo "PASS"
