name: Test explicit version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "3.2"
          force: "false"
      - name: Assert installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed=true, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert cobc binary works
        run: |
          if ! cobc --info >/dev/null 2>&1; then
            echo "FAIL: cobc --info failed"
            exit 1
          fi
          echo "PASS"
