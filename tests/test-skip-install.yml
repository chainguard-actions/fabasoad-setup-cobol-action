---
name: Test skip install when cobc already present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install cobc via apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gnucobol
          cobc --version
      - id: action
        uses: .
        with:
          version: "3.3"
          force: "false"
      - name: Assert installed output is false (skipped)
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual installed output: '$ACTUAL'"
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: expected installed=false (skipped) but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: installed is not true as expected (installation was skipped)"
      - name: Assert cobc is still available
        run: |
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc not found in PATH after skip"
            exit 1
          fi
          echo "PASS: cobc is still available at $(which cobc)"
