---
name: Test skip install when cobc is already installed and force is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install GnuCOBOL via apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gnucobol
          cobc --version
          echo "Pre-installed cobc at $(which cobc)"
      - id: action
        uses: .
        with:
          force: "false"
      - name: Assert installed output is false (installation skipped)
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed=false (skipped) but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: installed=false (installation correctly skipped)"
      - name: Assert cobc is still available (pre-installed version)
        run: |
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc is not available on PATH"
            exit 1
          fi
          echo "PASS: cobc is available at $(which cobc)"
          cobc --info
