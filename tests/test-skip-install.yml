---
name: Test skip install - cobc already installed and force is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake cobc binary to simulate already-installed state
        run: |
          mkdir -p /tmp/fake-cobol-bin
          cat > /tmp/fake-cobol-bin/cobc << 'SCRIPT'
          #!/bin/sh
          echo "GnuCOBOL 3.2.0"
          exit 0
          SCRIPT
          chmod +x /tmp/fake-cobol-bin/cobc
          echo "/tmp/fake-cobol-bin" >> "$GITHUB_PATH"
      - name: Verify fake cobc is on PATH
        run: |
          which cobc
          echo "cobc found at: $(which cobc)"
      - id: action
        uses: .
        with:
          version: "3.2"
          force: "false"
      - name: Assert installed output is false (installation skipped)
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual installed: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed=false (skipped) but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: installed=false (installation was correctly skipped)"
      - name: Assert cobc is still available on PATH
        run: |
          echo "cobc path: $(which cobc || echo 'not found')"
          if ! command -v cobc > /dev/null 2>&1; then
            echo "FAIL: cobc not found on PATH"
            exit 1
          fi
          echo "PASS: cobc is still available"
