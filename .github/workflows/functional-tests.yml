---
name: Functional Tests

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/functional-tests.yml
      - src/**
      - action.yml
  schedule:
    # Every Friday at 09:00 JST
    - cron: "0 0 * * 5"
  workflow_dispatch: {}

defaults:
  run:
    shell: sh

permissions: {}

jobs:
  run-script:
    name: Run script
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        version: ["4.0", "3.2"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup COBOL
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: Validate script
        run: |
          cobc -x ./HelloWorld.cob
          [ "$(./HelloWorld)" = "Hello World!" ] || exit 1;

  test-force:
    name: Test force
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        force: ["true", "false"]
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup COBOL 1
        id: setup-cobol-1
        uses: ./
      - name: Setup COBOL 2
        id: setup-cobol-2
        uses: ./
        with:
          force: ${{ matrix.force }}
      - name: Test action completion
        env:
          INSTALLED_1: "${{ steps.setup-cobol-1.outputs.installed }}"
          INSTALLED_2: "${{ steps.setup-cobol-2.outputs.installed }}"
          MATRIX_FORCE: "${{ matrix.force }}"
        run: |
          test_equal() {
            if [ "${2}" != "${3}" ]; then
              echo "::error title=${1}::Expected: ${3}. Actual: ${2}."
              exit 1
            fi
          }
          test_equal "Wrong \"installed\" output from setup-cobol-1" \
            "${INSTALLED_1}" \
            "true"
          test_equal "Wrong \"installed\" output from setup-cobol-2" \
            "${INSTALLED_2}" \
            "${MATRIX_FORCE}"
